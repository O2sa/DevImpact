name: Leaderboard Worker GHCR Image

on:
  push:
    branches:
      - main
    paths:
      - "ops/docker/**"
      - "ops/cron/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/**"
      - "lib/**"
      - "app/**"
      - "types/**"
      - ".github/workflows/leaderboard-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: leaderboard-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push GHCR Image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/o2sa/devimpact-leaderboard
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=,format=long
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/docker/Dockerfile.worker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
